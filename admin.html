<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieBot Admin</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff6b35;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .order h3 {
            color: #ff6b35;
            margin-top: 0;
        }

        .status {
            font-weight: bold;
        }

        .status-select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .status-message {
            margin-top: 8px;
            font-weight: bold;
        }

        .logout {
            background: #555;
            margin-left: 10px;
        }

    </style>

</head>


<body>


<header>

    <h1>🍔 FoodieBot Admin</h1>

    <p>Order Management</p>

</header>


<div class="container">


    <!-- LOGIN -->

    <div
        class="box"
        id="loginBox"
    >

        <h2>🔐 Admin Login</h2>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
        >

        <button onclick="login()">
            Login
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>


    <!-- ORDERS -->

    <div
        class="box hidden"
        id="ordersBox"
    >

        <h2>📦 Customer Orders</h2>

        <button onclick="loadOrders()">
            🔄 Refresh Orders
        </button>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

        <div id="orders">
            No orders loaded.
        </div>

    </div>


</div>


<script>


const API_URL =
    "https://hd4vj2xs60.execute-api.us-east-1.amazonaws.com/chat";


let adminPassword = "";


// =====================================================
// LOGIN
// =====================================================

async function login() {

    const password =
        document
            .getElementById("adminPassword")
            .value
            .trim();


    if (password === "") {

        document
            .getElementById("loginError")
            .innerText =
                "Please enter your password.";

        return;

    }


    adminPassword =
        password;


    const success =
        await checkAdmin();


    if (success) {

        document
            .getElementById("loginBox")
            .classList
            .add("hidden");


        document
            .getElementById("ordersBox")
            .classList
            .remove("hidden");


        document
            .getElementById("adminPassword")
            .value = "";


        loadOrders();

    }

}


// =====================================================
// CHECK ADMIN PASSWORD
// =====================================================

async function checkAdmin() {

    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            command:
                                "admin orders",

                            adminKey:
                                adminPassword

                        })

                }
            );


        if (
            response.status === 401
        ) {

            document
                .getElementById("loginError")
                .innerText =
                    "❌ Incorrect admin password.";

            adminPassword = "";

            return false;

        }


        if (!response.ok) {

            document
                .getElementById("loginError")
                .innerText =
                    "❌ Unable to connect to server.";

            adminPassword = "";

            return false;

        }


        return true;

    }


    catch (error) {

        console.error(error);

        document
            .getElementById("loginError")
            .innerText =
                "❌ Server connection failed.";

        adminPassword = "";

        return false;

    }

}


// =====================================================
// LOAD ORDERS
// =====================================================

async function loadOrders() {

    const ordersDiv =
        document
            .getElementById("orders");


    ordersDiv.innerHTML =
        "⏳ Loading orders...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            command:
                                "admin orders",

                            adminKey:
                                adminPassword

                        })

                }
            );


        if (
            response.status === 401
        ) {

            logout();

            return;

        }


        const data =
            await response.json();


        let result =
            data;


        if (data.body) {

            result =
                JSON.parse(
                    data.body
                );

        }


        if (
            !result.orders ||
            result.orders.length === 0
        ) {

            ordersDiv.innerHTML =
                "<p>📦 No orders found.</p>";

            return;

        }


        ordersDiv.innerHTML =
            "";


        const orders =
            [...result.orders]
                .reverse();


        orders.forEach(
            function(order) {

                const orderDiv =
                    document.createElement(
                        "div"
                    );


                orderDiv.className =
                    "order";


                let itemsText =
                    "";


                if (
                    Array.isArray(
                        order.Items
                    )
                ) {

                    order.Items.forEach(
                        function(item) {

                            itemsText +=
                                `🍴 ${item.FoodName} × ${item.Quantity}<br>`;

                        }
                    );

                }


                orderDiv.innerHTML = `

                    <h3>
                        📦 Order ${order.OrderID}
                    </h3>

                    <p>
                        👤 <b>Customer:</b>
                        ${order.CustomerName}
                    </p>

                    <p>
                        📍 <b>Address:</b>
                        ${order.Address}
                    </p>

                    <p>
                        🍔 <b>Items:</b><br>
                        ${itemsText}
                    </p>

                    <p>
                        💰 <b>Total:</b>
                        ₹${order.Total}
                    </p>


                    <p class="status">

                        🚚 <b>Status:</b>

                        <span
                            id="status-${order.OrderID}"
                        >
                            ${order.OrderStatus}
                        </span>

                    </p>


                    <label>

                        <b>
                            Change Order Status:
                        </b>

                    </label>


                    <select
                        class="status-select"

                        onchange="
                            updateOrderStatus(
                                '${order.OrderID}',
                                this.value,
                                this
                            )
                        "
                    >

                        <option
                            value="Preparing"
                            ${order.OrderStatus === "Preparing"
                                ? "selected"
                                : ""}
                        >
                            🟠 Preparing
                        </option>


                        <option
                            value="Confirmed"
                            ${order.OrderStatus === "Confirmed"
                                ? "selected"
                                : ""}
                        >
                            🔵 Confirmed
                        </option>


                        <option
                            value="Out for Delivery"
                            ${order.OrderStatus === "Out for Delivery"
                                ? "selected"
                                : ""}
                        >
                            🟣 Out for Delivery
                        </option>


                        <option
                            value="Delivered"
                            ${order.OrderStatus === "Delivered"
                                ? "selected"
                                : ""}
                        >
                            🟢 Delivered
                        </option>

                    </select>


                    <div
                        class="status-message"
                        id="message-${order.OrderID}"
                    ></div>

                `;


                ordersDiv.appendChild(
                    orderDiv
                );

            }
        );

    }


    catch (error) {

        console.error(error);

        ordersDiv.innerHTML =
            "<p class='error'>❌ Unable to load orders.</p>";

    }

}


// =====================================================
// UPDATE ORDER STATUS
// =====================================================

async function updateOrderStatus(
    orderId,
    newStatus,
    selectElement
) {

    const messageDiv =
        document.getElementById(
            "message-" + orderId
        );


    const statusSpan =
        document.getElementById(
            "status-" + orderId
        );


    const oldStatus =
        statusSpan.innerText.trim();


    messageDiv.innerText =
        "⏳ Updating...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            command:
                                "update order status",

                            adminKey:
                                adminPassword,

                            orderId:
                                orderId,

                            status:
                                newStatus

                        })

                }
            );


        const data =
            await response.json();


        let result =
            data;


        if (data.body) {

            try {

                result =
                    JSON.parse(
                        data.body
                    );

            }

            catch (e) {

                console.error(
                    "Response parsing error:",
                    e
                );

            }

        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to update status"
            );

        }


        statusSpan.innerText =
            newStatus;


        messageDiv.innerText =
            "✅ Status updated to " +
            newStatus;

    }


    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        messageDiv.innerText =
            "❌ " + error.message;

    }

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    adminPassword =
        "";


    document
        .getElementById("ordersBox")
        .classList
        .add("hidden");


    document
        .getElementById("loginBox")
        .classList
        .remove("hidden");


    document
        .getElementById("orders")
        .innerHTML =
            "No orders loaded.";

}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodieBot Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff6b35;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .login-box,
        .orders-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .order h3 {
            margin-top: 0;
            color: #ff6b35;
        }

        .status {
            font-weight: bold;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 FoodieBot Admin</h1>
        <p>Order Management Dashboard</p>
    </header>

    <div class="container">

        <!-- LOGIN -->

        <div class="login-box" id="loginBox">

            <h2>🔐 Admin Login</h2>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
            >

            <button onclick="login()">
                Login
            </button>

            <div id="loginError" class="error"></div>

        </div>


        <!-- ORDERS -->

        <div class="orders-box hidden" id="ordersBox">

            <h2>📦 Customer Orders</h2>

            <button onclick="loadOrders()">
                🔄 Refresh Orders
            </button>

            <div id="orders">
                Loading orders...
            </div>

        </div>

    </div>


<script>

const API_URL =
    "https://hd4vj2xs60.execute-api.us-east-1.amazonaws.com/chat";


// =====================================================
// ADMIN PASSWORD
// =====================================================

// CHANGE THIS PASSWORD
const ADMIN_PASSWORD =
    "FoodieAdmin123";


// =====================================================
// LOGIN
// =====================================================

function login() {

    const password =
        document.getElementById(
            "adminPassword"
        ).value;

    const error =
        document.getElementById(
            "loginError"
        );

    if (
        password ===
        ADMIN_PASSWORD
    ) {

        document
            .getElementById(
                "loginBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "ordersBox"
            )
            .classList
            .remove("hidden");

        loadOrders();

    } else {

        error.innerText =
            "❌ Incorrect password";

    }

}


// =====================================================
// LOAD ORDERS
// =====================================================

async function loadOrders() {

    const ordersDiv =
        document.getElementById(
            "orders"
        );

    ordersDiv.innerHTML =
        "Loading orders...";


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        command:
                            "admin orders",

                        adminKey:
                            ADMIN_PASSWORD

                    })
                }
            );


        const data =
            await response.json();


        let result =
            data;


        if (data.body) {

            result =
                JSON.parse(
                    data.body
                );

        }


        if (
            !result.orders ||
            result.orders.length === 0
        ) {

            ordersDiv.innerHTML =
                "<p>📦 No orders found.</p>";

            return;

        }


        ordersDiv.innerHTML = "";


        result.orders
            .reverse()
            .forEach(order => {

                const orderDiv =
                    document.createElement(
                        "div"
                    );

                orderDiv.className =
                    "order";


                let itemsText = "";


                if (
                    order.Items &&
                    Array.isArray(
                        order.Items
                    )
                ) {

                    order.Items
                        .forEach(item => {

                            itemsText +=
                                `🍴 ${item.FoodName} × ${item.Quantity}<br>`;

                        });

                }


                orderDiv.innerHTML = `

                    <h3>
                        📦 Order ${order.OrderID}
                    </h3>

                    <p>
                        👤 <b>Customer:</b>
                        ${order.CustomerName}
                    </p>

                    <p>
                        📍 <b>Address:</b>
                        ${order.Address}
                    </p>

                    <p>
                        🍔 <b>Items:</b><br>
                        ${itemsText}
                    </p>

                    <p>
                        💰 <b>Total:</b>
                        ₹${order.Total}
                    </p>

                    <p class="status">
                        🚚 Status:
                        ${order.OrderStatus}
                    </p>

                `;


                ordersDiv.appendChild(
                    orderDiv
                );

            });

    }

    catch (error) {

        console.error(
            error
        );

        ordersDiv.innerHTML =
            "<p class='error'>❌ Unable to load orders.</p>";

    }

}

</script>

</body>
</html>
